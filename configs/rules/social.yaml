# Pack: social. Posting sites with threads and replies (Reddit, X, Stack Exchange, forums):
# promotion that depends on whether someone joins conversations.

version: 1

rules:
  - id: R009_single_site_self_promotion
    description: Posting little but links to one website, without ever joining in.
    category: spam
    score_floor: 0.6
    # Seen on real Reddit data: accounts posting hundreds of links to their own site, each
    # to a different article (so never copies, and R003 misses them), and almost never
    # replying to anyone. Experts who link a lot also reply, so they are not caught.
    when:
      all:
        - {feature: posts_7d, op: ">=", value: 10}
        - {feature: link_ratio_7d, op: ">=", value: 0.9}
        - {feature: top_domain_share_7d, op: ">=", value: 0.9}
        - {feature: reply_share_7d, op: "<=", value: 0.1}
    reason: >-
      {posts_7d:.0f} posts this week, {link_ratio_7d:.0%} with links and {top_domain_share_7d:.0%}
      of links to the same website, while only {reply_share_7d:.0%} are replies to others

  - id: R010_reply_spam
    description: Replies under other people's posts that keep pushing one website.
    category: spam
    score_floor: 0.6
    # Found by the scenario library: R009 assumes self-promoters never reply, so spam
    # placed only as replies escaped it. Experts who cite sources link to several sites,
    # and links to the platform's own pages (own_domains) do not count.
    when:
      all:
        - {feature: posts_7d, op: ">=", value: 10}
        - {feature: reply_share_7d, op: ">=", value: 0.9}
        - {feature: link_ratio_7d, op: ">=", value: 0.9}
        - {feature: top_domain_share_7d, op: ">=", value: 0.9}
    reason: >-
      {posts_7d:.0f} posts this week, {reply_share_7d:.0%} of them replies to others,
      {link_ratio_7d:.0%} with links and {top_domain_share_7d:.0%} of links to the same website
