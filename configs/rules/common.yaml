# Detection rules, in packs by kind of platform (one file per pack).
# A platform file picks its packs with `rule_packs`, e.g. [common, social];
# a platform that names none gets every pack. Platform files never contain logic.
#
# A rule fires when its condition holds for a user's features (as of a moment).
# - Count features are used as percentiles within the platform (<name>_pct), so a
#   threshold like "top 1%" means the same on every platform.
# - A missing value (unknown) never satisfies a comparison, so "unknown" never triggers.
# - A rule may not look at account age alone; the loader rejects such rules.
#
# Fields:
#   score_floor  a strong signal: the score is at least this when the rule fires
#   weight       a weaker signal: on its own it can raise the score only to WATCH
#   Several fired rules combine: each removes a share of the remaining doubt
#   (0.75 and 0.6 together give 1 - 0.25 * 0.4 = 0.9).
#   category     which kind of abuse the rule points to: spam, bot, hijacked, scam, coordinated
#   mode         active (affects scores) or shadow (only recorded, to test a new rule safely)
#   reason       readable explanation; {feature} placeholders are filled with the values

# Pack: common. Rules for every kind of platform: bursts, bots, copied posts, scam links, sudden
# change, and payment scams asked for in messages.

version: 1

rules:
  - id: R001_duplicate_burst
    description: A burst of near-identical posts.
    category: spam
    score_floor: 0.75
    when:
      all:
        - {feature: posts_1h_pct, op: ">=", value: 99}
        - {feature: posts_1h, op: ">=", value: 5}
        # The burst itself, not the whole day: a stolen account's first burst must not be
        # diluted by the owner's normal posts from earlier that day (scenario library).
        - {feature: duplicate_ratio_1h, op: ">=", value: 0.8}
    reason: >-
      Posted {posts_1h:.0f} times in the last hour (percentile {posts_1h_pct:.1f} on this platform),
      and {duplicate_ratio_1h:.0%} of them are near-identical

  - id: R002_machine_like_posting
    description: Posting at near-fixed intervals around the clock, at high volume.
    category: bot
    score_floor: 0.7
    when:
      all:
        - {feature: timing_regularity, op: ">=", value: 0.85}
        - {feature: active_hours_7d, op: ">=", value: 18}
        - {feature: posts_24h_pct, op: ">=", value: 90}
    reason: >-
      Actions come at almost exactly equal intervals (regularity {timing_regularity:.2f})
      and at {active_hours_7d:.0f} different hours of the day this week

  - id: R003_link_campaign
    description: Repeatedly pushing the same website with copied posts.
    category: spam
    score_floor: 0.6
    when:
      all:
        - {feature: link_ratio_7d, op: ">=", value: 0.7}
        - {feature: top_domain_share_7d, op: ">=", value: 0.9}
        - {feature: duplicate_ratio_7d, op: ">=", value: 0.5}
    reason: >-
      {link_ratio_7d:.0%} of this week's posts contain a link, {top_domain_share_7d:.0%} of links
      go to the same website, and {duplicate_ratio_7d:.0%} of posts repeat earlier ones

  - id: R004_sudden_change_to_spam
    description: An established account suddenly posting far more, and far more repetitive or link-heavy than its own past.
    category: hijacked
    score_floor: 0.6
    when:
      all:
        - {feature: account_age_days, op: ">=", value: 30}
        - {feature: rate_vs_baseline, op: ">=", value: 5}
        # Ratios need enough posts behind them: one linked post is "100% links".
        - {feature: posts_24h, op: ">=", value: 5}
        # Compared with this user's OWN past, not with a fixed level: on real Q&A sites
        # experts always link to sources, so "many links" alone flagged trusted members.
        # More links only counts when they push one site the user never used before: a
        # maintainer telling many threads "this moved, see <docs page>" is not a thief,
        # and neither is a keen sharer posting a different new site each time.
        - any:
            - {feature: duplicate_ratio_change_24h, op: ">=", value: 0.5}
            - all:
                - {feature: link_ratio_change_24h, op: ">=", value: 0.5}
                - {feature: new_site_push_share_24h, op: ">=", value: 0.5}
    reason: >-
      Activity is {rate_vs_baseline:.1f}x this {account_age_days:.0f}-day-old account's usual level,
      and compared with its own past, links are up {link_ratio_change_24h:+.0%}
      ({new_site_push_share_24h:.0%} to one site it never linked before) and repeated posts
      up {duplicate_ratio_change_24h:+.0%}

  - id: R005_reported_and_ignored
    description: Content that others report a lot and rarely reply to.
    category: spam
    weight: 0.35
    when:
      all:
        - {feature: reports_received_7d_pct, op: ">=", value: 98}
        - {feature: reports_received_7d, op: ">=", value: 3}
        - {feature: replies_per_post_7d, op: "<", value: 0.3}
    reason: >-
      Received {reports_received_7d:.0f} reports this week (percentile {reports_received_7d_pct:.1f}
      on this platform) and few replies ({replies_per_post_7d:.2f} per post)

  - id: R006_shortened_links
    description: Most posts use URL shorteners, which hide where links go.
    category: spam
    weight: 0.2
    when:
      all:
        - {feature: shortener_ratio_7d, op: ">=", value: 0.6}
        - {feature: posts_7d, op: ">=", value: 5}
    reason: "{shortener_ratio_7d:.0%} of this week's posts use URL shorteners such as bit.ly"

  - id: R007_copy_paste_heavy
    description: Most recent posts copy earlier ones (a weaker, slower signal).
    category: spam
    weight: 0.3
    when:
      all:
        - {feature: duplicate_ratio_7d, op: ">=", value: 0.6}
        - {feature: posts_7d, op: ">=", value: 5}
    reason: "{duplicate_ratio_7d:.0%} of this week's {posts_7d:.0f} posts repeat earlier ones"

  - id: R008_known_scam_site
    description: Linking to a site on the blocklist of known scam or malware sites.
    category: scam
    score_floor: 0.9
    severity: critical  # may reach HIGH even with little history: the evidence is direct
    when:
      all:
        - {feature: blocked_domain_posts_7d, op: ">=", value: 1}
    reason: "Linked to a known scam or malware website ({blocked_domain_posts_7d:.0f} posts this week)"

  - id: R011_established_account_pushes_unknown_site
    description: An account with history suddenly links far more, mostly to a site nobody else links.
    category: hijacked
    score_floor: 0.6
    # A takeover eased in over a week never reaches R004's jump in activity. A first try
    # without "nobody else links it" flagged a trusted Stack Exchange expert and Reddit
    # users who had started linking GitHub or YouTube; those sites have many linkers.
    when:
      all:
        - {feature: history_days, op: ">=", value: 14}
        # Real data: people sharing a document or an image a few times in a discussion
        # (5-6 posts, half of them links) also fit; a thief posts mostly links, at volume.
        - {feature: posts_24h, op: ">=", value: 6}
        - {feature: link_ratio_24h, op: ">=", value: 0.75}
        - {feature: link_ratio_change_24h, op: ">=", value: 0.5}
        - {feature: new_site_push_share_24h, op: ">=", value: 0.8}
        - {feature: top_site_linkers, op: "<=", value: 2}
    reason: >-
      Compared with its own past, this account's links are up {link_ratio_change_24h:+.0%},
      mostly ({new_site_push_share_24h:.0%}) to one website it never linked before this
      week, which almost nobody else on the platform links ({top_site_linkers:.0f} accounts)

  - id: R015_coordinated_site_push
    description: Part of a group of accounts that all started pushing the same site this week.
    category: coordinated
    score_floor: 0.6
    # A long-known site (YouTube, GitHub) has many earlier linkers; a ring's site has
    # only the ring. The user must also be mostly pushing that site.
    when:
      all:
        - {feature: posts_7d, op: ">=", value: 3}
        - {feature: link_ratio_7d, op: ">=", value: 0.6}
        - {feature: top_domain_share_7d, op: ">=", value: 0.6}
        - {feature: top_site_new_linkers_7d, op: ">=", value: 5}
        - {feature: top_site_new_linker_share_7d, op: ">=", value: 0.8}
        # Real data: viral new sites (a prank site, a meme generator) also gain many new
        # linkers in a week, but each person shares them about once; a ring keeps pushing.
        - {feature: top_site_links_per_new_linker_7d, op: ">=", value: 2.5}
    reason: >-
      Mostly links one website ({top_domain_share_7d:.0%} of links), which
      {top_site_new_linkers_7d:.0f} accounts started linking this week
      ({top_site_new_linker_share_7d:.0%} of everyone who ever linked it), and keep linking
      it ({top_site_links_per_new_linker_7d:.1f} links each)

  - id: R016_copied_across_accounts
    description: The same long message posted by several different accounts within a day.
    category: coordinated
    score_floor: 0.6
    when:
      all:
        - {feature: posts_24h, op: ">=", value: 3}
        - {feature: copied_by_others_24h, op: ">=", value: 4}
    reason: >-
      {copied_by_others_24h:.0f} other accounts posted the same long message as this one
      in the last day

  - id: R012_offsite_risky_payment
    description: Pushing people to continue elsewhere and to pay in ways common in scams.
    category: scam
    score_floor: 0.6
    # At least 5 messages, so one odd message cannot trigger it (real data: a placeholder
    # email in a beginner's question on a crypto Q&A site).
    when:
      all:
        - {feature: posts_7d, op: ">=", value: 5}
        - {feature: offsite_contact_share_7d, op: ">=", value: 0.3}
        - {feature: risky_payment_share_7d, op: ">=", value: 0.3}
    reason: >-
      {offsite_contact_share_7d:.0%} of this week's messages ask to continue outside the
      platform, and {risky_payment_share_7d:.0%} bring up payment methods common in scams
      (gift cards, crypto, wire transfers)
