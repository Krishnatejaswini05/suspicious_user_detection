# CI/CD on GitHub Actions (free for public repositories).
#
#   test        style, types and the test suite, on the oldest and newest supported Python
#   docker      build the demo image, start it and check the dashboard really answers;
#               on main, publish it to GitHub's container registry (ghcr.io)
#   kubernetes  deploy the image to a throwaway Kubernetes cluster (kind) and check it
#   deploy      on main, publish the tested commit to the Hugging Face Space; runs only
#               once the HF_SPACE variable and HF_TOKEN secret are set (see README)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Style (ruff)
        run: |
          ruff format --check .
          ruff check .
      - name: Types (mypy)
        run: mypy src tests
      - name: Tests (pytest)
        run: pytest -q

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build
        run: docker build -t riskdetect-demo:ci .
      - name: Start it and check the dashboard answers
        run: |
          docker run -d --name demo -p 7860:7860 riskdetect-demo:ci
          for i in $(seq 1 60); do
            curl -sf http://localhost:7860/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:7860/health | tee /dev/stderr | grep -q '"demo": true'
          curl -sf http://localhost:7860/ | grep -q "<title>Risk Review</title>"
          curl -sf "http://localhost:7860/review-queue?limit=1" | grep -q '"count": [1-9]'
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:7860/events \
            -H "Content-Type: application/json" -d '{"platform": "synthetic_forum", "records": []}')
          test "$status" = "403"   # sending events is off in the demo
      - name: Container logs
        if: failure()
        run: docker logs demo
      - name: Publish to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag riskdetect-demo:ci "$IMAGE:${GITHUB_SHA}"
          docker tag riskdetect-demo:ci "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

  kubernetes:
    name: Kubernetes (kind)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t riskdetect-demo:ci .
      - uses: helm/kind-action@v1
        with:
          cluster_name: riskdetect
      - name: Load the image into the cluster
        run: kind load docker-image riskdetect-demo:ci --name riskdetect
      - name: Deploy
        run: |
          kubectl kustomize deploy/k8s \
            | sed "s#ghcr.io/krishnatejaswini05/suspicious_user_detection:latest#riskdetect-demo:ci#" \
            | kubectl apply -f -
          kubectl rollout status deployment/riskdetect --timeout=300s
      - name: Check it answers through the service
        run: |
          kubectl port-forward service/riskdetect 8080:80 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8080/health | grep -q '"status": "ok"'
          curl -sf http://localhost:8080/ | grep -q "<title>Risk Review</title>"
      - name: Cluster state
        if: failure()
        run: |
          kubectl get all,pvc
          kubectl describe pods -l app=riskdetect
          kubectl logs -l app=riskdetect --tail=100

  deploy:
    name: Deploy to Hugging Face
    needs: [docker, kubernetes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    environment: huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub
      - name: Publish this commit to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: python deploy/huggingface/deploy.py
