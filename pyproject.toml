[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "riskdetect"
version = "0.1.0"
description = "Platform-agnostic user behavior risk detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "pyarrow>=21",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/riskdetect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Word lists written as "a b c".split() read better than long list literals.
ignore = ["SIM905"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
